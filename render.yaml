services:
  - type: web
    name: ifcm-cuida
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/ifcm.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: ifcm-data
      mountPath: /var/data
      sizeGB: 1
